name: Branch Name

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Branch naming convention
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name and PR target
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|chore|refactor|docs|spike)/[0-9]+-[A-Za-z0-9]+(-[A-Za-z0-9]+)*$ ]]; then
            echo "::error::Invalid branch name '$BRANCH_NAME'. Expected <type>/<numeric-ticket-id>-<description> (letters, numbers, and hyphens)."
            echo "::error::Allowed types: feature, bugfix, hotfix, chore, refactor, docs, spike."
            exit 1
          fi

          if [[ "$BRANCH_NAME" == hotfix/* ]]; then
            if [[ "$BASE_BRANCH" != "main" ]]; then
              echo "::error::Hotfix branches must target the production branch 'main', not '$BASE_BRANCH'."
              exit 1
            fi
          elif [[ "$BASE_BRANCH" != "develop" ]]; then
            echo "::error::Development branches must target 'develop', not '$BASE_BRANCH'."
            exit 1
          fi
