name: Branch Name

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Branch naming convention
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0

      - name: Validate branch name and PR target
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "develop" || "$BRANCH_NAME" == "iith" ]]; then
            echo "::notice::Skipping branch naming validation for the existing base branch '$BRANCH_NAME'."
            exit 0
          fi

          if [[ ! "$BRANCH_NAME" =~ ^(feature|bugfix|hotfix|chore|refactor|docs|spike)/[0-9]+-[A-Za-z0-9]+(-[A-Za-z0-9]+)*$ ]]; then
            echo "::error::Invalid branch name '$BRANCH_NAME'. Expected <type>/<numeric-ticket-id>-<description> (letters, numbers, and hyphens)."
            echo "::error::Allowed types: feature, bugfix, hotfix, chore, refactor, docs, spike."
            exit 1
          fi

          DESCRIPTION="${BRANCH_NAME#*/}"
          DESCRIPTION="${DESCRIPTION#*-}"
          if (( ${#DESCRIPTION} > 20 )); then
            echo "::error::Description in '$BRANCH_NAME' exceeds the 20-character maximum."
            exit 1
          fi

          if [[ "$BRANCH_NAME" == hotfix/* ]]; then
            if [[ "$BASE_BRANCH" != "main" ]]; then
              echo "::error::Hotfix branches must target the production branch 'main', not '$BASE_BRANCH'."
              exit 1
            fi
          elif [[ "$BASE_BRANCH" != "develop" ]]; then
            echo "::error::Development branches must target 'develop', not '$BASE_BRANCH'."
            exit 1
          fi

          if ! git fetch --no-tags origin "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"; then
            echo "::error::Could not fetch target branch '$BASE_BRANCH'; cannot verify the PR branch base."
            exit 1
          fi

          if ! git merge-base --is-ancestor "origin/${BASE_BRANCH}" HEAD; then
            echo "::error::The latest '$BASE_BRANCH' commit is not an ancestor of '$BRANCH_NAME'. Update the PR branch from '$BASE_BRANCH' and try again."
            exit 1
          fi
